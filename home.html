<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   
    <meta name="listings-api" content="http://localhost:8080/api/room-posts" />
    <title>홈 | 자취방 찾기</title>
    <style>
      :root { --blue: #1b63f0; --ink: #0b1730; --muted: #8fa0bd; --line: #edf0f5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; background: #f6f8fc; color: var(--ink); font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      button, input { font: inherit; }
      button { border: 0; cursor: pointer; }
      .app { position: relative; width: min(100%, 480px); min-height: 100dvh; margin: 0 auto; padding: 35px 22px 104px; background: #fff; overflow: hidden; }
      .topbar { display: flex; gap: 20px; align-items: center; }
      .search { flex: 1; height: 59px; display: flex; align-items: center; gap: 16px; padding: 0 24px; color: var(--muted); background: #f7f8fa; border-radius: 15px; }
      .search svg { width: 25px; flex: none; stroke: currentColor; }
      .search input { width: 100%; min-width: 0; color: var(--ink); background: transparent; border: 0; outline: 0; font-size: 17px; letter-spacing: -0.05em; }
      .search input::placeholder { color: var(--muted); opacity: 1; }
      .icon-button { width: 59px; height: 59px; display: grid; place-items: center; color: var(--muted); background: #f7f8fa; border-radius: 50%; }
      .icon-button svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.7; }
      h1 { margin: 51px 0 28px; font-size: 25px; line-height: 1.2; letter-spacing: -0.075em; }
      .chip { flex: none; min-width: 76px; height: 54px; padding: 0 20px; color: #9aa8c0; background: #f7f8fa; border: 2px solid transparent; border-radius: 14px; font-size: 18px; letter-spacing: -0.06em; }
      .chip.active { color: var(--blue); background: #f8fbff; border-color: #8db4ff; font-weight: 700; }

      .filter-panel { max-height: 0; overflow: hidden; transition: max-height .28s ease; }
      .filter-panel.open { max-height: 700px; }
      .filter-panel-inner { margin-top: 24px; padding: 22px 20px; display: grid; gap: 22px; background: #f9fafc; border-radius: 18px; }
      .filter-field label { display: block; margin-bottom: 10px; font-size: 14px; font-weight: 700; }
      .filter-field input[type="text"], .filter-field input[type="number"], .filter-field input[type="date"] { width: 100%; height: 48px; padding: 0 14px; border: 0; border-radius: 12px; background: #fff; color: var(--ink); font-size: 15px; outline: 0; }
      .filter-field input:focus { outline: 2px solid #8db4ff; }
      .filter-type-group { display: flex; gap: 10px; flex-wrap: wrap; }
      .filter-type-group .chip { min-width: 0; height: 42px; padding: 0 16px; font-size: 15px; }
      .filter-range { display: flex; align-items: center; gap: 8px; }
      .filter-range input { flex: 1; min-width: 0; }
      .filter-range .unit-label { flex: none; color: var(--muted); font-size: 14px; }
      .filter-range .range-dash { flex: none; color: var(--muted); }
      .filter-actions { display: flex; gap: 10px; }
      .filter-reset-btn { flex: none; width: 100px; height: 54px; background: #eef0f4; color: #55627c; font-size: 15px; font-weight: 700; border-radius: 14px; }
      .filter-apply-btn { flex: 1; height: 54px; background: var(--blue); color: #fff; font-size: 16px; font-weight: 700; border-radius: 14px; }
      .listing-list { display: grid; gap: 26px; }
      .listing { position: relative; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 17px; min-height: 150px; cursor: pointer; }
      .listing-image { width: 150px; height: 150px; overflow: hidden; border-radius: 13px; background: #e8eef9; }
      .listing-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .listing-body { min-width: 0; padding: 3px 26px 30px 0; }
      .listing-title { display: block; overflow: hidden; font-size: 16px; line-height: 1.3; font-weight: 700; letter-spacing: -0.07em; text-overflow: ellipsis; white-space: nowrap; }
      .listing-price { margin: 9px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; letter-spacing: -0.04em; }
      .more { position: absolute; top: -5px; right: 0; width: 20px; height: 27px; padding: 0; color: #d6d6d6; background: transparent; font-size: 24px; line-height: 15px; letter-spacing: 1px; }
      .listing-actions { position: absolute; right: 0; bottom: 1px; display: flex; gap: 18px; }
      .listing-actions button { width: 27px; height: 27px; padding: 0; color: var(--muted); background: transparent; }
      .listing-actions button.liked { color: #ef4444; }
      .listing-actions svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 2; }
      .listing-actions .liked svg { fill: currentColor; }
      .empty { padding: 60px 0; color: var(--muted); text-align: center; }
      .add-button { position: fixed; z-index: 3; bottom: 109px; left: calc(50% + min(240px, 50vw) - 76px); width: 72px; height: 72px; display: grid; place-items: center; color: #fff; background: var(--blue); border-radius: 50%; box-shadow: 0 7px 12px rgba(27, 99, 240, .28); }
      .add-button svg { width: 35px; height: 35px; stroke: currentColor; stroke-width: 2; }
      .bottom-nav { position: fixed; z-index: 2; bottom: 0; left: 50%; width: min(100%, 480px); height: 92px; display: grid; grid-template-columns: repeat(5, 1fr); transform: translateX(-50%); background: rgba(255,255,255,.97); border-top: 1px solid var(--line); }
      .nav-item { display: grid; place-items: center; align-content: center; gap: 6px; padding: 9px 0 7px; color: var(--muted); background: transparent; font-size: 13px; letter-spacing: -0.06em; }
      .nav-item.active { color: var(--blue); }
      .nav-item svg { width: 29px; height: 29px; fill: none; stroke: currentColor; stroke-width: 1.9; }
      .nav-item.active svg { fill: currentColor; stroke: currentColor; }
      @media (max-width: 380px) { .app { padding: 28px 16px 94px; } .topbar { gap: 12px; } .listing { grid-template-columns: 36vw minmax(0, 1fr); gap: 13px; min-height: 36vw; } .listing-image { width: 36vw; height: 36vw; } .chip { min-width: 70px; padding: 0 15px; } .listing-title { font-size: 15px; } .listing-price { font-size: 12px; } }

      .mypage-title { margin: 4px 0 32px; font-size: 26px; font-weight: 700; letter-spacing: -0.04em; }
      .profile-row { display: flex; align-items: center; gap: 18px; }
      .profile-avatar { width: 72px; height: 72px; border-radius: 50%; background: #eef1f5; display: grid; place-items: center; flex: none; }
      .profile-avatar svg { width: 40px; height: 40px; fill: none; stroke: #b7c0cf; stroke-width: 1.6; }
      .profile-name { display: block; font-size: 19px; font-weight: 700; letter-spacing: -0.03em; }
      .mypage-divider { margin: 28px 0; border: 0; border-top: 1px solid var(--line); }
      .mypage-list { display: grid; }
      .mypage-row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border: 0; background: transparent; font-size: 16px; color: var(--ink); text-align: left; }
      .mypage-row .row-icon { width: 22px; height: 22px; fill: none; stroke: #55627c; stroke-width: 1.6; flex: none; }
      .mypage-row span { flex: 1; }
      .mypage-row .chevron { width: 18px; height: 18px; fill: none; stroke: #c3cbdb; stroke-width: 1.8; flex: none; }
    </style>
  </head>
  <body>
    <main class="app">
      <div id="home-view">
        <header class="topbar">
          <label class="search" aria-label="매물 검색">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.7" fill="none" stroke-width="2"/><path d="m17 17 4.2 4.2" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="search-input" type="search" placeholder="지역, 학교, 역 이름으로 검색" />
          </label>
          <button class="icon-button" type="button" id="filter-toggle" aria-label="조건 검색" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h20" stroke-linecap="round"/><circle cx="9" cy="6" r="2.2" fill="#fff"/><path d="M4 12h20" stroke-linecap="round"/><circle cx="15" cy="12" r="2.2" fill="#fff"/><path d="M4 18h20" stroke-linecap="round"/><circle cx="9" cy="18" r="2.2" fill="#fff"/></svg>
          </button>
        </header>

        <div class="filter-panel" id="filter-panel">
          <div class="filter-panel-inner">
            <div class="filter-field">
              <label for="filter-location">위치</label>
              <input id="filter-location" type="text" placeholder="지역, 학교, 역 이름을 입력하세요" />
            </div>

            <div class="filter-field">
              <label>매물 종류</label>
              <div class="filter-type-group" id="filter-type-group">
                <button class="chip active" type="button" data-type="ALL">전체</button>
                <button class="chip" type="button" data-type="ONE_ROOM">원룸</button>
                <button class="chip" type="button" data-type="TWO_ROOM">투룸</button>
                <button class="chip" type="button" data-type="OFFICETEL">오피스텔</button>
                <button class="chip" type="button" data-type="SHARE_HOUSE">쉐어하우스</button>
              </div>
            </div>

            <div class="filter-field">
              <label>월세 구간</label>
              <div class="filter-range">
                <input id="filter-rent-min" type="number" inputmode="numeric" placeholder="0" />
                <span class="unit-label">만원</span>
                <span class="range-dash">~</span>
                <input id="filter-rent-max" type="number" inputmode="numeric" placeholder="제한 없음" />
                <span class="unit-label">만원</span>
              </div>
            </div>

            <div class="filter-field">
              <label>입주 가능 시기</label>
              <div class="filter-range">
                <input id="filter-movein-from" type="date" />
                <span class="range-dash">~</span>
                <input id="filter-movein-to" type="date" />
              </div>
            </div>

            <div class="filter-field">
              <label>계약 종료일</label>
              <div class="filter-range">
                <input id="filter-contractend-from" type="date" />
                <span class="range-dash">~</span>
                <input id="filter-contractend-to" type="date" />
              </div>
            </div>

            <div class="filter-actions">
              <button class="filter-reset-btn" type="button" id="filter-reset">초기화</button>
              <button class="filter-apply-btn" type="button" id="filter-apply">확인</button>
            </div>
          </div>
        </div>

        <h1>이런 매물은 어때요?</h1>

        <section id="listing-list" class="listing-list" aria-live="polite"></section>
      </div>

      <div id="mypage-view" hidden>
        <h1 class="mypage-title">마이페이지</h1>

        <div class="profile-row">
          <div class="profile-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.3-6 8-6s7.3 2 8 6" stroke-linecap="round"/></svg>
          </div>
          <div>
            <strong class="profile-name" id="profile-nickname">닉네임</strong>
          </div>
        </div>

        <hr class="mypage-divider" />

        <nav class="mypage-list" aria-label="마이페이지 메뉴">
          <button class="mypage-row" type="button" id="mypage-my-listings">
            <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>내가 등록한 매물</span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="mypage-row" type="button">
            <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke-linecap="round"/></svg>
            <span>내 문의 내역</span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="mypage-row" type="button">
            <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>알림</span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="mypage-row" type="button">
            <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M3 12h2.2M18.8 12H21M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6" stroke-linecap="round"/></svg>
            <span>설정</span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="mypage-row" type="button" id="auth-btn"></button>
        </nav>
      </div>
    </main>

    <button class="add-button" type="button" aria-label="매물 등록" id="add-button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16" fill="none" stroke-linecap="round"/></svg>
    </button>

    <nav class="bottom-nav" aria-label="하단 메뉴">
      <button class="nav-item active" type="button" id="nav-home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" stroke-linejoin="round"/></svg><span>홈</span></button>
      <button class="nav-item" type="button" id="nav-explore"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.7"/><path d="m17 17 4.2 4.2" stroke-linecap="round"/></svg><span>탐색</span></button>
      <button class="nav-item" type="button" id="nav-liked"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.7a5.4 5.4 0 0 0-7.6 0L12 5.9l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.7a5.4 5.4 0 0 0 0-7.6Z" stroke-linejoin="round"/></svg><span>찜</span></button>
      <button class="nav-item" type="button" id="nav-chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5c0 4.1-3.6 7.5-8 7.5a8.9 8.9 0 0 1-3.1-.6L4 20l1.6-4.1A7.1 7.1 0 0 1 4 11.5C4 7.4 7.6 4 12 4s8 3.4 8 7.5Z" stroke-linejoin="round"/><path d="M8 11h.01M12 11h.01M16 11h.01" stroke-linecap="round" stroke-width="2.5"/></svg><span>채팅</span></button>
      <button class="nav-item" type="button" id="nav-mypage"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.3-6 8-6s7.3 2 8 6" stroke-linecap="round"/></svg><span>마이</span></button>
    </nav>
    <script src="home.js" defer></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 백엔드 연동 지점 1/2: 매물 목록(GET) API 주소. upload.html의 매물 등록(POST)과 같은 주소를 씁니다.
         이 GET 요청은 로그인 없이도 호출 가능해야 합니다 (start.html의 "시작하기"로 바로 들어와도 매물이 보여야 함).
         서버에서 이 엔드포인트에 인증을 요구하지 않도록 해주세요. -->
    <meta name="listings-api" content="/api/listings" />
    <title>홈 | 자취방 찾기</title>
    <style>
      :root { --blue: #1b63f0; --ink: #0b1730; --muted: #8fa0bd; --line: #edf0f5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; background: #f6f8fc; color: var(--ink); font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      button, input { font: inherit; }
      button { border: 0; cursor: pointer; }
      .app { position: relative; width: min(100%, 480px); min-height: 100dvh; margin: 0 auto; padding: 35px 22px 104px; background: #fff; overflow: hidden; }
      .topbar { display: flex; gap: 20px; align-items: center; }
      .search { flex: 1; height: 59px; display: flex; align-items: center; gap: 16px; padding: 0 24px; color: var(--muted); background: #f7f8fa; border-radius: 15px; }
      .search svg { width: 25px; flex: none; stroke: currentColor; }
      .search input { width: 100%; min-width: 0; color: var(--ink); background: transparent; border: 0; outline: 0; font-size: 17px; letter-spacing: -0.05em; }
      .search input::placeholder { color: var(--muted); opacity: 1; }
      .icon-button { width: 59px; height: 59px; display: grid; place-items: center; color: var(--muted); background: #f7f8fa; border-radius: 50%; }
      .icon-button svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.7; }
      h1 { margin: 51px 0 28px; font-size: 25px; line-height: 1.2; letter-spacing: -0.075em; }
      .chips { display: flex; gap: 16px; margin-bottom: 32px; overflow-x: auto; scrollbar-width: none; }
      .chips::-webkit-scrollbar { display: none; }
      .chip { flex: none; min-width: 76px; height: 54px; padding: 0 20px; color: #9aa8c0; background: #f7f8fa; border: 2px solid transparent; border-radius: 14px; font-size: 18px; letter-spacing: -0.06em; }
      .chip.active { color: var(--blue); background: #f8fbff; border-color: #8db4ff; font-weight: 700; }
      .listing-list { display: grid; gap: 31px; }
      .listing { position: relative; display: grid; grid-template-columns: 186px minmax(0, 1fr); gap: 20px; min-height: 186px; }
      .listing-image { width: 186px; height: 186px; overflow: hidden; border-radius: 15px; background: #e8eef9; }
      .listing-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .listing-body { min-width: 0; padding: 4px 31px 38px 0; }
      .listing-title { display: block; overflow: hidden; font-size: 18px; line-height: 1.35; font-weight: 700; letter-spacing: -0.075em; text-overflow: ellipsis; white-space: nowrap; }
      .listing-price { margin: 12px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; letter-spacing: -0.05em; }
      .more { position: absolute; top: -5px; right: 0; width: 22px; height: 30px; padding: 0; color: #d6d6d6; background: transparent; font-size: 27px; line-height: 17px; letter-spacing: 1px; }
      .listing-actions { position: absolute; right: 0; bottom: 1px; display: flex; gap: 22px; }
      .listing-actions button { width: 31px; height: 31px; padding: 0; color: var(--muted); background: transparent; }
      .listing-actions button.liked { color: var(--blue); }
      .listing-actions svg { width: 29px; height: 29px; fill: none; stroke: currentColor; stroke-width: 2; }
      .listing-actions .liked svg { fill: currentColor; }
      .empty { padding: 60px 0; color: var(--muted); text-align: center; }
      .add-button { position: fixed; z-index: 3; bottom: 109px; left: calc(50% + min(240px, 50vw) - 76px); width: 72px; height: 72px; display: grid; place-items: center; color: #fff; background: var(--blue); border-radius: 50%; box-shadow: 0 7px 12px rgba(27, 99, 240, .28); }
      .add-button svg { width: 35px; height: 35px; stroke: currentColor; stroke-width: 2; }
      .bottom-nav { position: fixed; z-index: 2; bottom: 0; left: 50%; width: min(100%, 480px); height: 92px; display: grid; grid-template-columns: repeat(5, 1fr); transform: translateX(-50%); background: rgba(255,255,255,.97); border-top: 1px solid var(--line); }
      .nav-item { display: grid; place-items: center; align-content: center; gap: 6px; padding: 9px 0 7px; color: var(--muted); background: transparent; font-size: 13px; letter-spacing: -0.06em; }
      .nav-item.active { color: var(--blue); }
      .nav-item svg { width: 29px; height: 29px; fill: none; stroke: currentColor; stroke-width: 1.9; }
      .nav-item.active svg { fill: currentColor; stroke: currentColor; }
      @media (max-width: 380px) { .app { padding: 28px 16px 94px; } .topbar { gap: 12px; } .listing { grid-template-columns: 42vw minmax(0, 1fr); gap: 15px; min-height: 42vw; } .listing-image { width: 42vw; height: 42vw; } .chip { min-width: 70px; padding: 0 15px; } .listing-title { font-size: 16px; } .listing-price { font-size: 14px; } }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <label class="search" aria-label="매물 검색">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.7" fill="none" stroke-width="2"/><path d="m17 17 4.2 4.2" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search-input" type="search" placeholder="지역, 학교, 역 이름으로 검색" />
        </label>
        <button class="icon-button" type="button" aria-label="알림">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>

      <h1>이런 매물은 어때요?</h1>
      <nav class="chips" aria-label="매물 유형">
        <button class="chip active" type="button" data-type="ONE_ROOM">원룸</button>
        <button class="chip" type="button" data-type="TWO_ROOM">투룸</button>
        <button class="chip" type="button" data-type="OFFICETEL">오피스텔</button>
        <button class="chip" type="button" data-type="SHARE_HOUSE">쉐어하우스</button>
      </nav>

      <section id="listing-list" class="listing-list" aria-live="polite"></section>
    </main>

    <button class="add-button" type="button" aria-label="매물 등록">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16" fill="none" stroke-linecap="round"/></svg>
    </button>

    <nav class="bottom-nav" aria-label="하단 메뉴">
      <button class="nav-item active" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" stroke-linejoin="round"/></svg><span>홈</span></button>
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.7"/><path d="m17 17 4.2 4.2" stroke-linecap="round"/></svg><span>탐색</span></button>
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.7a5.4 5.4 0 0 0-7.6 0L12 5.9l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.7a5.4 5.4 0 0 0 0-7.6Z" stroke-linejoin="round"/></svg><span>찜</span></button>
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5c0 4.1-3.6 7.5-8 7.5a8.9 8.9 0 0 1-3.1-.6L4 20l1.6-4.1A7.1 7.1 0 0 1 4 11.5C4 7.4 7.6 4 12 4s8 3.4 8 7.5Z" stroke-linejoin="round"/><path d="M8 11h.01M12 11h.01M16 11h.01" stroke-linecap="round" stroke-width="2.5"/></svg><span>채팅</span></button>
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.3-6 8-6s7.3 2 8 6" stroke-linecap="round"/></svg><span>마이</span></button>
    </nav>
    <script src="home.js" defer></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자취방 찾기</title>
    <style>
      :root { --blue: #1261ee; --ink: #071631; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; background: #fff; font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: var(--ink); }
      .app { width: min(100%, 480px); min-height: 100dvh; margin: auto; background: #fff; overflow: hidden; position: relative; }
      .onboarding { min-height: 100dvh; display: flex; flex-direction: column; text-align: center; padding: clamp(56px, 12.3dvh, 115px) clamp(24px, 8.33vw, 40px) 0; }
      h1 { margin: 0; font-size: clamp(30px, 7.08vw, 34px); line-height: 1.42; letter-spacing: -0.082em; font-weight: 700; }
      .subtitle { margin: clamp(16px, 2.9dvh, 27px) 0 0; color: #91a1bd; font-size: clamp(20px, 3.75vw, 18px); line-height: 1.65; letter-spacing: -0.075em; font-weight: 400; }
      .house-wrap { height: clamp(230px, 40.8dvh, 380px); display: grid; place-items: center; margin-top: clamp(24px, 5dvh, 47px); }
      .house { width: 205px; height: 160px; position: relative; filter: drop-shadow(0 15px 12px rgba(58, 103, 190, .18)); }
      .ground { position: absolute; bottom: -22px; left: -17px; width: 240px; height: 72px; background: repeating-linear-gradient(90deg, #ebfbf4 0 44px, #fff 44px 49px), repeating-linear-gradient(0deg, transparent 0 32px, #fff 32px 37px); border-radius: 50%; border: 1px solid #d5eee4; transform: perspective(80px) rotateX(23deg); }
      .main-house { position: absolute; z-index: 1; width: 138px; height: 105px; bottom: 0; left: 34px; background: linear-gradient(135deg, #fbfcff, #c9dcff); border: 3px solid #80a9f8; border-top: 0; }
      .roof { position: absolute; z-index: 2; width: 168px; height: 82px; left: 19px; top: 15px; background: linear-gradient(135deg, #e7eeff, #9cbdff); clip-path: polygon(50% 0, 100% 70%, 96% 76%, 50% 16%, 4% 76%, 0 70%); }
      .door { position: absolute; z-index: 3; bottom: 0; left: 82px; width: 25px; height: 47px; border: 3px solid #6e9cf1; border-bottom: 0; border-radius: 13px 13px 0 0; background: #f8fbff; }
      .window { position: absolute; z-index: 3; width: 17px; height: 23px; border: 2px solid #6392ee; background: #1270ef; box-shadow: inset 6px 0 #d9ebff; }
      .w1 { left: 53px; bottom: 50px; } .w2 { right: 53px; bottom: 50px; } .w3 { left: 55px; bottom: 17px; } .w4 { right: 55px; bottom: 17px; }
      .pin { position: absolute; z-index: 5; top: -28px; left: 84px; width: 45px; height: 59px; background: #0761ef; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #78a6ff; box-shadow: 5px 5px 10px #95b7f5; }
      .pin::after { content: ""; position: absolute; width: 16px; height: 16px; left: 12px; top: 12px; border-radius: 50%; background: #fff; }
      .actions { margin-top: auto; padding: 0 0 clamp(18px, 3.43dvh, 32px); }
      button { border: 0; font: inherit; font-weight: 700; cursor: pointer; }
      .start { width: 100%; height: clamp(54px, 7.3dvh, 68px); background: #1763ed; color: #fff; font-size: clamp(15px, 3.75vw, 18px); border-radius: clamp(11px, 1.5vw, 14px); box-shadow: none; }
      .login-link { display: grid; place-items: center; width: 100%; height: clamp(54px, 7.3dvh, 68px); margin: clamp(10px, 1.72dvh, 16px) 0 0; color: #54627a; background: #f1f3f6; border-radius: clamp(11px, 1.5vw, 14px); font-size: clamp(15px, 3.75vw, 18px); text-decoration: none; }
      .house-image { width: min(73.33vw, 352px); height: auto; display: block; }
      @media (max-height: 700px) {
        .onboarding { padding-top: 44px; }
        .house-wrap { height: 230px; margin-top: 20px; }
        .actions { padding-bottom: 16px; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="onboarding" aria-label="시작 화면">
        <h1>우리 학교 근처<br />딱 맞는 자취방 찾기</h1>
        <p class="subtitle">신뢰할 수 있는 매물과<br />안전한 거래를 한 곳에서</p>
        <div class="house-wrap" aria-hidden="true"><img class="house-image" src="assets/onboarding-house.png" alt="" /></div>
        <div class="actions"><button class="start" type="button" data-nav="home.html">시작하기</button><button class="login-link" type="button" data-nav="login.html">로그인</button></div>
      </section>
    </main>
    <script src="index.js" defer></script>
  </body>
</html>
